name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: Lint, format, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Synthesize CloudFormation
        run: npx cdk synth --all --quiet
